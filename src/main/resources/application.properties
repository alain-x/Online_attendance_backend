spring.application.name=attendance

# Comma-separated frontend origins (set APP_CORS_ALLOWED_ORIGINS on Railway)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://aninox.kesug.com,http://localhost:3000}
# Render injects PORT; keep 8080 for local development.
server.port=${PORT:8080}

# =========================
# DATABASE (Render PostgreSQL)
# =========================
# Render sets DATABASE_URL as postgres://... — converted to JDBC at startup.
# For local dev, set DB_* vars or SPRING_DATASOURCE_URL directly.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:attendance}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# MULTIPART FILE UPLOAD
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =========================
# JWT CONFIG
# =========================
# !!! WARNING: Change JWT_SECRET to a strong random value in production !!!
# Use at least 64 characters of alphanumeric/random data.
app.jwt.secret=${JWT_SECRET:please-change-this-secret-key-for-production-use-32chars-minimum}
app.jwt.expiration-minutes=${JWT_EXP_MINUTES:480}

# =========================
# BOOTSTRAP ADMIN
# =========================
# !!! WARNING: Change these passwords immediately after first login !!!
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap.systemadmin.username=${BOOTSTRAP_SYSTEMADMIN_USERNAME:sysadmin}
app.bootstrap.systemadmin.password=${BOOTSTRAP_SYSTEMADMIN_PASSWORD:sysadmin123}
app.bootstrap.clubadmin.username=${BOOTSTRAP_CLUBADMIN_USERNAME:clubadmin}
app.bootstrap.clubadmin.password=${BOOTSTRAP_CLUBADMIN_PASSWORD:clubadmin123}

# =========================
# ODOO (OPTIONAL)
# =========================
odoo.enabled=${ODOO_ENABLED:false}
odoo.base-url=${ODOO_BASE_URL:}
odoo.db=${ODOO_DB:}
odoo.username=${ODOO_USERNAME:}
odoo.password=${ODOO_PASSWORD:}