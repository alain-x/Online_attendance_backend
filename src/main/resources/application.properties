spring.application.name=attendance
server.port=8080

# =========================
# DATABASE (Render PostgreSQL)
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# JWT CONFIG
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXP_MINUTES:480}

# =========================
# BOOTSTRAP ADMIN
# =========================
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

# =========================
# ODOO (OPTIONAL)
# =========================
odoo.enabled=${ODOO_ENABLED:false}
odoo.base-url=${ODOO_BASE_URL:}
odoo.db=${ODOO_DB:}
odoo.username=${ODOO_USERNAME:}
odoo.password=${ODOO_PASSWORD:}